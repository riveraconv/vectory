<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

const TODAY = { when:'speed', vig:'amber', blur:'on', lines:'3d', ab:'boost', chase:'same', cab:'blur' };
const opt = { drive:'auto', ...TODAY, view:'both', slow:false, paused:false };
const HALF = 11, BAR = 11.5, VMAX = 400/3.6, BOOSTV = 100/3.6;
const rnd = (a, b) => a + Math.random() * (b - a);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const approach = (x, t, tau, dt) => x + (t - x) * (1 - Math.exp(-dt / tau));
const smooth01 = x => x * x * (3 - 2 * x);

// capas: 0 mundo · 2 solo cabina · 3 solo persecución · 4 máscara de cabina · 5 nave
const L_CAB = 2, L_CHASE = 3, L_MASK = 4, L_SHIP = 5;

// ================= CIRCUITO =================
const ctrl = [[0,0],[600,0],[1000,-100],[1150,-400],[1000,-700],[700,-750],[500,-600],[300,-700],[0,-800],[-300,-650],[-400,-350],[-250,-150]]
  .map(([x, z]) => new THREE.Vector3(x, 0, z));
const curve = new THREE.CatmullRomCurve3(ctrl, true, 'centripetal');
const L = curve.getLength(), STEP = 4, NS = Math.round(L / STEP);
const PT = [], RT = [], PHI = [];
for (let i = 0; i < NS; i++) {
  const u = i / NS, p = curve.getPointAt(u), t = curve.getTangentAt(u); t.y = 0; t.normalize();
  PT.push(p); RT.push(new THREE.Vector3(-t.z, 0, t.x)); PHI.push(Math.atan2(-t.x, -t.z));
}
const wrapA = a => { while (a > Math.PI) a -= 2*Math.PI; while (a < -Math.PI) a += 2*Math.PI; return a; };
const idx = s => ((Math.round(s / STEP) % NS) + NS) % NS;
const KAP = PHI.map((_, i) => wrapA(PHI[(i + 3) % NS] - PHI[(i - 3 + NS) % NS]) / (6 * STEP));
function frameAt(s) {
  const u = (((s % L) + L) % L) / L, p = curve.getPointAt(u), t = curve.getTangentAt(u); t.y = 0; t.normalize();
  return { p, t, r:new THREE.Vector3(-t.z, 0, t.x), phi:Math.atan2(-t.x, -t.z) };
}
const kAhead = (s, d0, d1) => { let m = 0; for (let d = d0; d <= d1; d += 8) m = Math.max(m, Math.abs(KAP[idx(s + d)])); return m; };

// ================= ESCENA =================
const glc = document.getElementById('gl'), hud = document.getElementById('hud'), hx = hud.getContext('2d');
const renderer = new THREE.WebGLRenderer({ canvas:glc, antialias:true });
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR); renderer.setClearColor(0x05070D, 1);
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.0;
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x05070D, 80, 1100);
const camA = new THREE.PerspectiveCamera(72, 16/9, 0.05, 4000);   // cabina
const camB = new THREE.PerspectiveCamera(62, 16/9, 0.1, 4000);    // persecución
camA.layers.enable(L_CAB);
camB.layers.enable(L_CHASE); camB.layers.enable(L_SHIP);
scene.add(camA); scene.add(camB);
const lm = (c, o, fog = true) => new THREE.LineBasicMaterial({ color:c, transparent:o < 1, opacity:o, fog });
const seg = arr => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3)); return g; };
const addL = (arr, c, o) => scene.add(new THREE.LineSegments(seg(arr), lm(c, o)));
const ADD = { blending:THREE.AdditiveBlending, transparent:true, depthWrite:false };

let cx0 = 0, cz0 = 0;
{ let a = Infinity, b = -Infinity, c = Infinity, d = -Infinity; PT.forEach(p => { a = Math.min(a, p.x); b = Math.max(b, p.x); c = Math.min(c, p.z); d = Math.max(d, p.z); }); cx0 = (a + b)/2; cz0 = (c + d)/2; }
let sky;
{
  const g = new THREE.SphereGeometry(2500, 48, 32), col = [], p = g.attributes.position, c = new THREE.Color();
  const dark = new THREE.Color(0x05070D), warm = new THREE.Color(0x2A1A0E), mid = new THREE.Color(0x140D0A);
  for (let i = 0; i < p.count; i++) {
    const h = p.getY(i) / 2500;
    if (h < -0.01) c.copy(dark); else if (h < 0.03) c.copy(warm); else if (h < 0.12) c.copy(warm).lerp(mid, (h-0.03)/0.09); else if (h < 0.3) c.copy(mid).lerp(dark, (h-0.12)/0.18); else c.copy(dark);
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  sky = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.BackSide, fog:false, depthWrite:false }));
  scene.add(sky);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(8000, 8000), new THREE.MeshBasicMaterial({ color:0x03050A }));
  ground.rotation.x = -Math.PI/2; ground.position.set(cx0, -0.05, cz0); scene.add(ground);
}
{
  const pos = [], ix = [];
  for (let i = 0; i < NS; i++) {
    const a = PT[i].clone().addScaledVector(RT[i], -HALF), b = PT[i].clone().addScaledVector(RT[i], HALF);
    pos.push(a.x, 0, a.z, b.x, 0, b.z);
    const j = (i + 1) % NS; ix.push(2*i, 2*j, 2*i+1, 2*i+1, 2*j, 2*j+1);
  }
  const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3)); g.setIndex(ix);
  scene.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ color:0x060A16, side:THREE.DoubleSide })));
}
function loop(off, y, c, o) {
  const a = [];
  for (let i = 0; i < NS; i++) { const j = (i + 1) % NS, p = PT[i].clone().addScaledVector(RT[i], off), q = PT[j].clone().addScaledVector(RT[j], off); a.push(p.x, y, p.z, q.x, y, q.z); }
  addL(a, c, o);
}
[-1, 1].forEach(k => {
  loop(k*HALF, 0.02, 0x5A82FF, 1); loop(k*HALF*0.474, 0.02, 0x245BFF, 0.8);
  [[0,0x36E7FF,1],[0.04,0x36E7FF,1],[0.4,0x36E7FF,0.85],[1.4,0x245BFF,0.5],[2.4,0x36E7FF,0.85],[2.96,0x36E7FF,1],[3,0x36E7FF,1]].forEach(([y, c, o]) => loop(k*BAR, y, c, o));
});
loop(0, 0.02, 0x245BFF, 0.8);
{
  const cross = [], pa = [], pb = [], arch = [];
  for (let i = 0; i < NS; i++) {
    if (i % 3 === 0) { const a = PT[i].clone().addScaledVector(RT[i], -HALF), b = PT[i].clone().addScaledVector(RT[i], HALF); cross.push(a.x, 0.02, a.z, b.x, 0.02, b.z); }
    [-1, 1].forEach(k => { const q = PT[i].clone().addScaledVector(RT[i], k*BAR); pa.push(q.x,0,q.z, q.x,0.4,q.z, q.x,2.4,q.z, q.x,3,q.z); pb.push(q.x,0.4,q.z, q.x,2.4,q.z); });
    if (i % 20 === 0) {   // arcos cada 80 m: ayudan a leer el desenfoque
      const a = PT[i].clone().addScaledVector(RT[i], -BAR - 0.5), b = PT[i].clone().addScaledVector(RT[i], BAR + 0.5);
      arch.push(a.x,0,a.z, a.x,8,a.z, b.x,0,b.z, b.x,8,b.z, a.x,8,a.z, b.x,8,b.z, a.x,7.4,a.z, b.x,7.4,b.z);
    }
  }
  addL(cross, 0x245BFF, 0.5); addL(pa, 0x36E7FF, 0.6); addL(pb, 0x245BFF, 0.4); addL(arch, 0x36E7FF, 0.9);
}
{
  let s = 7; const r = () => (s = (s * 16807) % 2147483647) / 2147483647;
  const mE = lm(0xFF9D32, 0.24, false), mW = lm(0xFF9D32, 0.07, false);
  let n = 0, tries = 0;
  while (n < 140 && tries < 2400) {
    tries++;
    const x = cx0 + (r() - 0.5) * 2600, z = cz0 + (r() - 0.5) * 2200, w = 14 + r()*40, h = 30 + r()*200, d = 14 + r()*40;
    let near = false; for (let i = 0; i < NS; i += 10) if (Math.hypot(PT[i].x - x, PT[i].z - z) < 45 + Math.max(w, d)) { near = true; break; }
    if (near) continue;
    const g = new THREE.BoxGeometry(w, h, d); g.translate(0, h/2, 0);
    const grp = new THREE.Group(); grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(g), mE));
    const win = []; for (let y = 8; y < h - 4; y += 9) win.push(-w/2,y,d/2, w/2,y,d/2, -w/2,y,-d/2, w/2,y,-d/2);
    grp.add(new THREE.LineSegments(seg(win), mW)); grp.position.set(x, -6, z); scene.add(grp); n++;
  }
}
{
  const sun = new THREE.DirectionalLight(0xFFF1E0, 2.0); sun.position.set(4, 10, -5); scene.add(sun);
  const back = new THREE.DirectionalLight(0xFF9D50, 1.0); back.position.set(-6, 2.5, 9); scene.add(back);
  scene.add(new THREE.HemisphereLight(0xB0B8C8, 0x101010, 0.45));
}

// ================= NAVE (silueta aproximada de VECTOR, solo en persecución) =================
const ship = new THREE.Group(); ship.rotation.order = 'YXZ'; scene.add(ship);
const NOZ = [new THREE.Vector3(-0.95, 0.42, 3.12), new THREE.Vector3(0.95, 0.42, 3.12)];
const flames = [];
{
  const sh = new THREE.Shape();
  [[0,-4.0],[0.42,-2.6],[0.75,-0.6],[2.63,1.9],[2.5,2.45],[1.05,2.3],[0.95,3.31],[-0.95,3.31],[-1.05,2.3],[-2.5,2.45],[-2.63,1.9],[-0.75,-0.6],[-0.42,-2.6]]
    .forEach(([x, z], i) => i ? sh.lineTo(x, z) : sh.moveTo(x, z));
  const g = new THREE.ExtrudeGeometry(sh, { depth:0.34, bevelEnabled:true, bevelThickness:0.08, bevelSize:0.06, bevelSegments:1 });
  g.rotateX(Math.PI/2); g.translate(0, 0.42, 0);
  const hullMat = new THREE.MeshStandardMaterial({ color:0x39414F, roughness:0.45, metalness:0.6 });
  ship.add(new THREE.Mesh(g, hullMat));
  ship.add(new THREE.LineSegments(new THREE.EdgesGeometry(g, 25), new THREE.LineBasicMaterial({ color:0x36E7FF, transparent:true, opacity:0.5 })));
  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.62, 5.6, 10, 1), hullMat); body.rotation.x = Math.PI/2; body.scale.set(1, 1, 0.55); body.position.set(0, 0.5, 0.2); ship.add(body);
  const can = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 8, 0, Math.PI*2, 0, Math.PI/2), new THREE.MeshStandardMaterial({ color:0x0A1428, roughness:0.1, metalness:0.2, emissive:0x061830 }));
  can.scale.set(0.8, 0.55, 2.2); can.position.set(0, 0.68, -1.0); ship.add(can);
  const cone = new THREE.ConeGeometry(1, 1, 16, 1, true); cone.rotateX(Math.PI/2); cone.translate(0, 0, 0.5);
  NOZ.forEach(n => {
    const pod = new THREE.Mesh(new THREE.CylinderGeometry(0.36, 0.4, 2.4, 12), hullMat); pod.rotation.x = Math.PI/2; pod.scale.set(1, 1, 0.62); pod.position.set(n.x, n.y, 1.92); ship.add(pod);
    const glow = new THREE.Mesh(new THREE.CircleGeometry(0.27, 20), new THREE.MeshBasicMaterial({ color:0x36E7FF, toneMapped:false })); glow.position.copy(n).z += 0.01; glow.scale.set(1, 0.62, 1); ship.add(glow);
    const out = new THREE.Mesh(cone, new THREE.MeshBasicMaterial({ color:0x36E7FF, ...ADD, opacity:0.55, side:THREE.DoubleSide, toneMapped:false }));
    const core = new THREE.Mesh(cone, new THREE.MeshBasicMaterial({ color:0xE8FBFF, ...ADD, opacity:0.8, side:THREE.DoubleSide, toneMapped:false }));
    out.position.copy(n); core.position.copy(n); ship.add(out); ship.add(core);
    flames.push({ out, core, glow });
  });
}
ship.traverse(o => o.layers.set(L_SHIP));

// ================= CABINA (aproximada, va pegada a la cámara de cabina) =================
const cockpit = new THREE.Group(); camA.add(cockpit);
{
  const dMat = new THREE.MeshBasicMaterial({ color:0x070B16, side:THREE.DoubleSide, fog:false });
  const eMat = new THREE.LineBasicMaterial({ color:0x36E7FF, transparent:true, opacity:0.95, fog:false, toneMapped:false });
  const e2 = new THREE.LineBasicMaterial({ color:0x245BFF, transparent:true, opacity:0.9, fog:false });
  const oMat = new THREE.LineBasicMaterial({ color:0xFF9D32, transparent:true, opacity:0.9, fog:false, toneMapped:false });

  };
  const lines = (arr, mat) => cockpit.add(new THREE.LineSegments(seg(arr), mat));
  // salpicadero
  quad([-2.4,-0.44,-1.0],[2.4,-0.44,-1.0],[2.4,-1.4,-0.85],[-2.4,-1.4,-0.85]);
  // capó del instrumental
  quad([-0.42,-0.44,-1.0],[0.42,-0.44,-1.0],[0.32,-0.35,-1.03],[-0.32,-0.35,-1.03]);
  // montantes
  quad([-1.2,-0.44,-1.0],[-1.02,-0.44,-1.0],[-0.6,0.95,-0.85],[-0.76,0.95,-0.85]);

  quad([-2.4,-0.44,-1.0],[-1.2,-0.44,-1.0],[-1.3,-0.2,-0.6],[-2.4,-0.2,-0.6]);
  quad([1.2,-0.44,-1.0],[2.4,-0.44,-1.0],[2.4,-0.2,-0.6],[1.3,-0.2,-0.6]);
  lines([
    -2.4,-0.44,-1.0, -0.42,-0.44,-1.0,  0.42,-0.44,-1.0, 2.4,-0.44,-1.0,
    -0.42,-0.44,-1.0, -0.32,-0.35,-1.03, -0.32,-0.35,-1.03, 0.32,-0.35,-1.03, 0.32,-0.35,-1.03, 0.42,-0.44,-1.0,
    -1.2,-0.44,-1.0, -0.76,0.95,-0.85, -1.02,-0.44,-1.0, -0.6,0.95,-0.85,
    1.2,-0.44,-1.0, 0.76,0.95,-0.85, 1.02,-0.44,-1.0, 0.6,0.95,-0.85,

  lines([-0.24,-0.4,-1.015, -0.04,-0.4,-1.015, 0.04,-0.4,-1.015, 0.24,-0.4,-1.015], oMat);

// ================= LÍNEAS DE VELOCIDAD 3D (las de hoy) =================
function mkLines(cam, layer) {
  const N = 240, g = new THREE.BufferGeometry();
  const pos = new Float32Array(N*6), col = new Float32Array(N*6);
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute('color', new THREE.BufferAttribute(col, 3).setUsage(THREE.DynamicDrawUsage));
  const m = new THREE.LineSegments(g, new THREE.LineBasicMaterial({ vertexColors:true, ...ADD, toneMapped:false, fog:false }));

const toggleSlow = () => { opt.slow = !opt.slow; bS.classList.toggle('on', opt.slow); };
bP.addEventListener('click', () => { togglePause(); bP.blur(); }); bS.addEventListener('click', () => { toggleSlow(); bS.blur(); });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['w','a','s','d','shift'].includes(k)) { e.preventDefault(); keys[k] = true; if (opt.drive !== 'me') setOpt('drive', 'me'); }
  else if (k === 'p') togglePause(); else if (k === 'l') toggleSlow();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function resize() {
  const st = document.getElementById('stage'), W = st.clientWidth, H = st.clientHeight;
  const ar = opt.view === 'both' ? 16/18 : 16/9;
  let w = W, h = W / ar; if (h > H) { h = H; w = H * ar; }
  const view = document.getElementById('view');
  view.style.width = w + 'px'; view.style.height = h + 'px';
  VW = w; VH = h; PW = w; PH = opt.view === 'both' ? h / 2 : h;
  view.style.setProperty('--u', (PH / 720) + 'px');

  compA.setSize(PW, PH); compB.setSize(PW, PH);
  maskRT.setSize(Math.max(4, Math.round(PW * DPR)), Math.max(4, Math.round(PH * DPR)));
  hud.width = Math.round(w * DPR); hud.height = Math.round(h * DPR);
}
addEventListener('resize', resize); resize();

function frame(now) {

}
