const cowlY = x => -0.200 - 0.028 * (x / 0.64) ** 2;   // borde trasero del cubre-instrumentos

function buildCockpit() {
  LIVE = newLive();
  const root = new THREE.Group(); root.name = 'CockpitHammer';

  // ---------------- Nose (morro corto y ancho, amarillo de maquinaria) ----------------
  const nose = B.group(root, 'Nose');

  for (let k = 0; k < 5; k++) B.mesh(B.strip(SEC.map(s => s[k]), SEC.map(s => s[k + 1])), MAT.PaintNose, nose, 'Nose_Skin_' + k);

  // banda central de chapa lagrimada (antirreflejos)

  B.mesh(B.strip(mirrorX(ag), ag), MAT.Tread, nose, 'Nose_Tread');
  // juntas y remaches

    const j = st.findIndex(s => s[0] < z), a = st[j - 1], b = st[j], t = (z - a[0]) / (b[0] - a[0]), w = a[1] + (b[1] - a[1]) * t, y = a[2] + (b[2] - a[2]) * t;
    B.mesh(B.poly([[-w * 0.6, y + 0.0015, z - 0.005], [w * 0.6, y + 0.0015, z - 0.005], [w * 0.6, y + 0.0015, z + 0.005], [-w * 0.6, y + 0.0015, z + 0.005]]), MAT.Dark, nose, 'Nose_Seam_' + i, { noShadow: true });
    for (let q = -3; q <= 3; q++) { const r = B.sphere(0.006, MAT.Steel, nose, 'Rivet', { noShadow: true }); r.scale.y = 0.4; r.position.set(q / 3 * w * 0.56, y + 0.002, z + 0.016); }
  });

  B.beam([-0.44, -0.75, -2.57], [0.44, -0.75, -2.57], 0.07, 0.05, [0, -0.8, 0], MAT.Steel, nose, 'Nose_Bumper');

  [-1, 1].forEach(k => {
    const rLE = [k * 0.38, -0.70, -2.85], rTE = [k * 0.38, -0.68, -2.30], tLE = [k * 2.35, -0.66, -2.95], tTE = [k * 2.35, -0.65, -2.62];

    B.mesh(B.poly([dn(rLE), dn(tLE), dn(tTE), dn(rTE)]), MAT.PlateDark, can, 'Canard_Bottom');
    B.mesh(B.strip([rLE, tLE], [dn(rLE), dn(tLE)]), MAT.Hazard, can, 'Canard_LeadingEdge');
    B.mesh(B.strip([rTE, tTE], [dn(rTE), dn(tTE)]), MAT.PlateDark, can, 'Canard_TrailingEdge');
    // punta caída

    { const m = emissive(LIGHT.beacon, 'M_Emissive_Nav'), l = B.sphere(0.022, m, can, k < 0 ? 'Led_Canard_L' : 'Led_Canard_R', { noShadow: true }); l.position.set(k * 2.49, -1.11, -2.84); LIVE.leds.push({ mat: m, base: 3, flick: 1 }); }

  });

  B.mesh(B.rbox(1.30, 0.40, 0.06, 0.01), MAT.PlateDark, B.group(dash, 'Dash_Face', [0, -0.40, -0.565], null, LOOK), 'Dash_FacePanel');
  const xs = []; for (let i = 0; i <= 16; i++) xs.push(-0.64 + 1.28 * i / 16);
  const rear = xs.map(x => [x, cowlY(x), cowlZ(x)]);
  const front = xs.map(x => [x, -0.430 - 0.020 * (x / 0.64) ** 2, -0.86]);

const composer = new EffectComposer(renderer);

const LAMP_OFF = new THREE.Color('#3A2A10');
function setLamp(mat, col, k) { mat.emissive.set(col); mat.emissiveIntensity = k; }
let last = performance.now();

  camera.rotation.set(EYE_PITCH + look.pitch + noise(tt + 7.7) * vib * 0.35, look.yaw, -incl * 0.25 + noise(tt + 5.3) * vib * 0.35, 'YXZ');

  LIVE.leds.forEach(a => a.mat.emissiveIntensity = a.base * a.flick);

    if (s === 'full') setLamp(l.mat, ST.main, 1.7); else if (s === 'cool') setLamp(l.mat, ST.over, 0.6); else if (s === 'locked') setLamp(l.mat, ST.crit, 2.0); else setLamp(l.mat, LAMP_OFF, 0.25); });

  composer.render();
}
