  'flame:today':'HOY · la llama de líneas de la spec efectos-velocidad', 'flame:new':'NUEVA · llama con shader de ruido, núcleo y penacho, y reacciones a cada tecla',
  'diam:on':'DIAMANTES · bandas brillantes quietas en la llama a fondo y con boost', 'diam:off':'SIN DIAMANTES',
  'haze:on':'CALOR · el aire tiembla detrás de las toberas (distorsión en pantalla)', 'haze:off':'SIN CALOR',
  'light:on':'LUZ EN EL CASCO · cada tobera ilumina la popa de la nave con su color', 'light:off':'SIN LUZ EN EL CASCO',
  'retro:on':'RETROEMPUJE · dos chorros azules en el morro al frenar', 'retro:off':'SIN RETROEMPUJE',
  'dmg:on':'DAÑO 3 · la llama tartamudea con cortes y chasquidos naranjas', 'dmg:off':'SIN DAÑO',
};
function toast(t) { const m = document.getElementById('mode'); m.textContent = t; m.style.opacity = 1; clearTimeout(toast.t); toast.t = setTimeout(() => m.style.opacity = 0, 3200); }
function setOpt(g, val) {
  opt[g] = val;
  document.querySelectorAll(`button[data-g="${g}"]`).forEach(x => x.classList.toggle('on', x.dataset.v === val));
  if (DESC[g + ':' + val]) toast(DESC[g + ':' + val]);
}
document.querySelectorAll('button[data-g]').forEach(b => b.addEventListener('click', () => { setOpt(b.dataset.g, b.dataset.v); b.blur(); }));
const bP = document.getElementById('bPause'), bS = document.getElementById('bSlow');
const togglePause = () => { opt.paused = !opt.paused; bP.classList.toggle('on', opt.paused); };
const toggleSlow = () => { opt.slow = !opt.slow; bS.classList.toggle('on', opt.slow); };
bP.addEventListener('click', () => { togglePause(); bP.blur(); }); bS.addEventListener('click', () => { toggleSlow(); bS.blur(); });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (['w','a','s','d',' ','shift'].includes(k)) { e.preventDefault(); keys[k] = true; if (opt.drive !== 'me') setOpt('drive', 'me'); }
  else if (k === 'p') togglePause(); else if (k === 'l') toggleSlow();
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function resize() {
  const st = document.getElementById('stage'), W = st.clientWidth, H = st.clientHeight;
  let w = W, h = W * 9/16; if (h > H) { h = H; w = H * 16/9; }
  const view = document.getElementById('view');
  view.style.width = w + 'px'; view.style.height = h + 'px'; view.style.setProperty('--u', (h / 720) + 'px');
  renderer.setSize(w, h, false); VW = w; VH = h;
  compA.setSize(w, h);
  const k = h / 720; compB.setSize(INSET.w * k, INSET.h * k);
  hazeRT.A.setSize(Math.max(4, w * DPR / 2), Math.max(4, h * DPR / 2)); hazeRT.B.setSize(Math.max(4, INSET.w * k * DPR / 2), Math.max(4, INSET.h * k * DPR / 2));
  hud.width = Math.round(w * DPR); hud.height = Math.round(h * DPR);
}
addEventListener('resize', resize); resize();
// empezar antes de una recta larga
{ let best = 0, bi = 0; for (let i = 0; i < NS; i++) { let run = 0; while (run < 200 && Math.abs(KAP[(i + run) % NS]) < 0.0015) run++; if (run > best) { best = run; bi = i; } } S.s = bi * STEP; }
update(0.016);
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (!opt.paused) update(dt * (opt.slow ? 0.25 : 1));
  render(); drawHud();
  requestAnimationFrame(frame);
}
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => { toast('AUTO enseña todo en bucle. Pulsa W, A, S, D, ESPACIO o SHIFT y conduces tú.'); requestAnimationFrame(t0 => { last = t0; frame(t0); }); });
