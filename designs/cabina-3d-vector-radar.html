  Dos colocaciones: 1 · junto a las pantallas (pantallas pequeñas entre las dos grandes) y 2 · en la consola.
  Parte del prototipo de referencia:
  PROTOTIPO DE REFERENCIA · Cabina de VECTOR, estilo CARRERAS
  Es la variante "3 · CARRERAS" de la cabina 3D de prueba, sin los estilos industrial y militar.
  La geometría, los materiales, las texturas y el HUD de las pantallas son los mismos.
  Fuente para la spec specs/cabinas-3d-1-vector.md:
    - Todo lo que hay dentro de buildCockpit() y las texturas se rehace en Blender (script Python).
    - El mundo (pista, torres), el postproceso y el bucle son solo la simulación: no se llevan a Blender.
    - Los comentarios "→ Nombre" marcan el nombre que debe tener la pieza en Blender (contrato con Godot).
  Ejes del prototipo (igual que Godot): X derecha, Y arriba, el piloto mira hacia -Z. Unidades: metros.

import * as THREE from 'three';

const V3 = THREE.Vector3;
const C = { cyan:0x36E7FF, blue:0x245BFF, orange:0xFF9D32, bg:0x05070D, red:0xFF4D5E };

// ---------- Datos de Vector ----------
const TOP = 396, MAX = TOP + 100;
const BASE_FOV = 70;
const GROUND = -1.45;
const HALF = 11;
const RADAR_RANGE = 120;   // m
const WARN = 12;           // m: nave pegada

// ---------- Render ----------
const view = document.getElementById('view');

// ================= MUNDO (solo simulación: NO va a Blender) =================
const world = new THREE.Scene();
world.fog = new THREE.Fog(C.bg, 30, 480);
const worldCam = new THREE.PerspectiveCamera(BASE_FOV, 16/9, 0.1, 2500);
const segGeom = arr => { const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(arr, 3)); return g; };
const lm = (c, op, fog = true) => new THREE.LineBasicMaterial({ color:c, transparent:op < 1, opacity:op, fog });
let sky;
{
  const g = new THREE.SphereGeometry(1500, 48, 32);
  const col = [], p = g.attributes.position, c = new THREE.Color();
  const dark = new THREE.Color(0x05070D), warm = new THREE.Color(0x2A1A0E), mid = new THREE.Color(0x140D0A);
  for (let i = 0; i < p.count; i++) {
    const h = p.getY(i) / 1500;
    if (h < -0.01) c.copy(dark);
    else if (h < 0.03) c.copy(warm);
    else if (h < 0.12) c.copy(warm).lerp(mid, (h - 0.03) / 0.09);
    else if (h < 0.3) c.copy(mid).lerp(dark, (h - 0.12) / 0.18);
    else c.copy(dark);
    col.push(c.r, c.g, c.b);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  sky = new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors:true, side:THREE.BackSide, fog:false, depthWrite:false }));
  world.add(sky);
  const out = new THREE.Mesh(new THREE.PlaneGeometry(4000, 4000), new THREE.MeshBasicMaterial({ color:0x03050A }));
  out.rotation.x = -Math.PI / 2; out.position.set(0, GROUND - 0.02, -1000); world.add(out);
  const road = new THREE.Mesh(new THREE.PlaneGeometry(HALF * 2, 3200), new THREE.MeshBasicMaterial({ color:0x060A16 }));
  road.rotation.x = -Math.PI / 2; road.position.set(0, GROUND, -1500); world.add(road);
  const L = (x, y, c, op) => world.add(new THREE.LineSegments(segGeom([x, y, 60, x, y, -3000]), lm(c, op)));
  [-1, 1].forEach(k => {
    L(k * HALF, GROUND + 0.01, 0x5A82FF, 1);
    L(k * HALF * 0.474, GROUND + 0.01, C.blue, 0.8);
    L(k * (HALF + 0.4), GROUND + 1.15, C.cyan, 1);
    L(k * (HALF + 0.4), GROUND + 0.6, C.blue, 0.55);
  });
  L(0, GROUND + 0.01, C.blue, 0.8);
}
const scroll = new THREE.Group(); world.add(scroll);
{
  const cross = [], posts = [];
  for (let i = -6; i < 300; i++) {
    const z = -i * 10;
    cross.push(-HALF, GROUND + 0.01, z, HALF, GROUND + 0.01, z);
    [-1, 1].forEach(k => posts.push(k * (HALF + 0.4), GROUND, z, k * (HALF + 0.4), GROUND + 1.15, z));
  }
  scroll.add(new THREE.LineSegments(segGeom(cross), lm(C.blue, 0.5)));
  scroll.add(new THREE.LineSegments(segGeom(posts), lm(C.blue, 0.45)));
}
const towers = [];
{
  const rnd = (() => { let s = 7; return () => (s = (s * 16807) % 2147483647) / 2147483647; })();
  const mEdge = lm(C.orange, 0.24, false), mWin = lm(C.orange, 0.07, false);
  for (let i = 0; i < 110; i++) {
    const w = 10 + rnd() * 35, h = 30 + rnd() * 170, d = 10 + rnd() * 35;
    const side = i % 2 ? 1 : -1;
    const grp = new THREE.Group();
    const bg = new THREE.BoxGeometry(w, h, d); bg.translate(0, h / 2, 0);
    grp.add(new THREE.LineSegments(new THREE.EdgesGeometry(bg), mEdge));
    const win = [];
    for (let y = 8; y < h - 4; y += 9) { win.push(-w/2, y, d/2, w/2, y, d/2); win.push(side < 0 ? w/2 : -w/2, y, d/2, side < 0 ? w/2 : -w/2, y, -d/2); }
    grp.add(new THREE.LineSegments(segGeom(win), mWin));
    grp.position.set(side * (60 + rnd() * 280), GROUND - 4, 40 - rnd() * 1300);
    world.add(grp); towers.push(grp);
  }
}

// ---------- Rivales (simulación) ----------
const shipGeo = (() => {
  const v = [[0, 0.35, -3.6], [-1.7, 0.25, 1.6], [1.7, 0.25, 1.6], [0, 0.95, 1.2], [0, 0.05, 1.2]];
  const f = [[0, 1, 3], [0, 3, 2], [0, 4, 1], [0, 2, 4], [1, 4, 3], [3, 4, 2]];
  const a = []; f.forEach(t => t.forEach(i => a.push(...v[i])));
  return new THREE.EdgesGeometry(segGeom(a));
})();
const rivals = [
  { base:35,  A:45, w:0.23, ph:0, la:[6, 0.31, 1] },
  { base:-25, A:35, w:0.19, ph:2, la:[7, 0.27, 4] },
  { base:5,   A:20, w:0.37, ph:4, la:[-6, 0.40, 2] },
  { base:110, A:70, w:0.11, ph:1, la:[5, 0.22, 0] },
  { far:true, off:920,   dv:-1.0, la:[4, 0.2, 1] },
  { far:true, off:-1550, dv:1.5,  la:[-4, 0.25, 3] },
].map(r => { const m = new THREE.LineSegments(shipGeo, lm(0xFF43D0, 1)); world.add(m); return { ...r, mesh:m, ds:0, lat:0 }; });
// ---------- Circuito del minimapa (simulación) ----------
const mapCurve = new THREE.CatmullRomCurve3([[0,0],[600,0],[1000,-100],[1150,-400],[1000,-700],[700,-750],[500,-600],[300,-700],[0,-800],[-300,-650],[-400,-350],[-250,-150]].map(([x, z]) => new V3(x, 0, z)), true, 'centripetal');
const mapL = mapCurve.getLength(), mapPts = mapCurve.getSpacedPoints(400);

// ================= ESCENA DE CABINA =================
const cockpit = new THREE.Scene();
const cockCam = new THREE.PerspectiveCamera(BASE_FOV, 16/9, 0.02, 30);
cockpit.add(cockCam);

// Entorno para reflejos: noche con la ciudad naranja en el horizonte y luces azules arriba
// → En Blender se renderiza como panorama equirectangular (cockpit_env) para el cielo de reflejos en Godot.
{
  const env = new THREE.Scene();
  env.background = new THREE.Color(0x020306);
  const em = (r, g, b) => new THREE.MeshBasicMaterial({ color:new THREE.Color(r, g, b), side:THREE.DoubleSide });
  for (let i = 0; i < 18; i++) {
    const a = i / 18 * Math.PI * 2, h = 1 + (i * 7 % 5) * 0.6;
    const m = new THREE.Mesh(new THREE.PlaneGeometry(2.5, h), em(0.55, 0.24, 0.08));
    m.position.set(Math.cos(a) * 12, h / 2 - 0.4, Math.sin(a) * 12); m.lookAt(0, h / 2 - 0.4, 0); env.add(m);
  }
  for (let i = 0; i < 4; i++) {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(14, 0.35), em(0.1, 0.22, 0.8));
    m.position.set(0, 9, -12 + i * 8); m.rotation.x = Math.PI / 2; env.add(m);
  }
  const top = new THREE.Mesh(new THREE.PlaneGeometry(30, 30), em(0.05, 0.07, 0.14)); top.position.y = 10; top.rotation.x = Math.PI / 2; env.add(top);
  const pm = new THREE.PMREMGenerator(renderer);
  cockpit.environment = pm.fromScene(env, 0.04).texture;
}

// ================= TEXTURAS PROCEDURALES =================
// → En Blender se generan con el mismo algoritmo y las mismas semillas y se guardan como imágenes PNG.
const N = 512;
function mkRng(seed) { let s = (seed * 2654435761) >>> 0 || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }
function valueNoise(cx, cy, rnd) {
  const g = new Float32Array(cx * cy); for (let i = 0; i < g.length; i++) g[i] = rnd();
  const out = new Float32Array(N * N);
  for (let y = 0; y < N; y++) {
    const fy = y / N * cy, iy = Math.floor(fy), ty = fy - iy, sy = ty * ty * (3 - 2 * ty), y0 = iy % cy, y1 = (iy + 1) % cy;
    for (let x = 0; x < N; x++) {
      const fx = x / N * cx, ix = Math.floor(fx), tx = fx - ix, sx = tx * tx * (3 - 2 * tx), x0 = ix % cx, x1 = (ix + 1) % cx;
      const a = g[y0 * cx + x0], b = g[y0 * cx + x1], c = g[y1 * cx + x0], d = g[y1 * cx + x1];
      out[y * N + x] = a + (b - a) * sx + (c - a) * sy + (a - b - c + d) * sx * sy;
    }
  }
  return out;
}
function fbm(rnd, c0 = 4, oct = 5, sx = 1, sy = 1) {
  const out = new Float32Array(N * N); let amp = 1, sum = 0;
  for (let o = 0; o < oct; o++) {
    const n = valueNoise(Math.max(1, Math.round((c0 << o) * sx)), Math.max(1, Math.round((c0 << o) * sy)), rnd);
    for (let i = 0; i < n.length; i++) out[i] += n[i] * amp;
    sum += amp; amp *= 0.5;
  }
  for (let i = 0; i < out.length; i++) out[i] /= sum;
  return out;
}
const cv = () => { const c = document.createElement('canvas'); c.width = c.height = N; return c; };
function toTex(canvas, color, rep) {
  const t = new THREE.CanvasTexture(canvas);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.anisotropy = 8;
  if (color) t.colorSpace = THREE.SRGBColorSpace;
  t.repeat.set(rep, rep);
  return t;
}
// H = altura (para el mapa normal), col = color RGB 0-255, rough = rugosidad 0-1
function fromArrays(H, col, rough, strength, rep) {
  const cc = cv(), rc = cv(), nc = cv();
  const ci = cc.getContext('2d').createImageData(N, N), ri = rc.getContext('2d').createImageData(N, N), ni = nc.getContext('2d').createImageData(N, N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x, o = i * 4;
    ci.data[o] = col[i * 3]; ci.data[o + 1] = col[i * 3 + 1]; ci.data[o + 2] = col[i * 3 + 2]; ci.data[o + 3] = 255;
    const r = Math.max(0, Math.min(1, rough[i])) * 255; ri.data[o] = ri.data[o + 1] = ri.data[o + 2] = r; ri.data[o + 3] = 255;
    const dx = H[y * N + (x + 1) % N] - H[y * N + (x - 1 + N) % N];
    const dy = H[((y + 1) % N) * N + x] - H[((y - 1 + N) % N) * N + x];
    let nx = -dx * strength, ny = dy * strength, nz = 1; const l = Math.hypot(nx, ny, nz); nx /= l; ny /= l; nz /= l;
    ni.data[o] = (nx * 0.5 + 0.5) * 255; ni.data[o + 1] = (ny * 0.5 + 0.5) * 255; ni.data[o + 2] = (nz * 0.5 + 0.5) * 255; ni.data[o + 3] = 255;
  }
  cc.getContext('2d').putImageData(ci, 0, 0); rc.getContext('2d').putImageData(ri, 0, 0); nc.getContext('2d').putImageData(ni, 0, 0);
  return { map:toTex(cc, true, rep), roughnessMap:toTex(rc, false, rep), normalMap:toTex(nc, false, rep) };
}
// Fibra de carbono (sarga 2×2) → T_Carbon_*
function carbonSet(rep) {
  const rnd = mkRng(91), cell = 16, fib = fbm(rnd, 32, 3, 1, 1);
  const H = new Float32Array(N * N), col = new Uint8ClampedArray(N * N * 3), rough = new Float32Array(N * N);
  for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {
    const i = y * N + x, cx = Math.floor(x / cell), cy = Math.floor(y / cell);
    const horiz = ((cx + cy) % 4 + 4) % 4 < 2;
    const t = horiz ? (y % cell) / cell : (x % cell) / cell;
    const along = horiz ? (x % (cell * 2)) / (cell * 2) : (y % (cell * 2)) / (cell * 2);
    const bump = Math.sin(Math.PI * t);
    H[i] = bump * 0.6 + Math.sin(Math.PI * along) * 0.15 + fib[i] * 0.08;
    const v = 14 + bump * (horiz ? 26 : 12) + fib[i] * 10;
    col[i * 3] = v; col[i * 3 + 1] = v * 1.02; col[i * 3 + 2] = v * 1.08;
    rough[i] = 0.42 - bump * 0.12;
  }
  return fromArrays(H, col, rough, 1.0, rep);
}
// Aluminio cepillado → T_Alu_* (semilla 41) y T_AluDark_* (semilla 42)
function brushedSet(base, rep, seed) {
  const rnd = mkRng(seed), streak = fbm(rnd, 2, 5, 1, 64), fine = fbm(rnd, 8, 3);
  const H = new Float32Array(N * N), col = new Uint8ClampedArray(N * N * 3), rough = new Float32Array(N * N);
  for (let i = 0; i < N * N; i++) {
    H[i] = streak[i] * 0.25;
    const v = 0.85 + (streak[i] - 0.5) * 0.35 + (fine[i] - 0.5) * 0.05;
    for (let c = 0; c < 3; c++) col[i * 3 + c] = base[c] * v;
    rough[i] = 0.4 + (streak[i] - 0.5) * 0.16;
  }
  return fromArrays(H, col, rough, 0.6, rep);
}
// Tejido antirreflejos (tipo alcántara) → T_Fabric_*
function fabricSet(base, rep) {
  const rnd = mkRng(55), fine = fbm(rnd, 64, 3), mid = fbm(rnd, 8, 3);
  const H = new Float32Array(N * N), col = new Uint8ClampedArray(N * N * 3), rough = new Float32Array(N * N);
  for (let i = 0; i < N * N; i++) {
    H[i] = fine[i] * 0.5;
    const v = 0.9 + (fine[i] - 0.5) * 0.25 + (mid[i] - 0.5) * 0.12;
    for (let c = 0; c < 3; c++) col[i * 3 + c] = base[c] * v;
    rough[i] = 0.96;
  }
  return fromArrays(H, col, rough, 1.2, rep);
}
// Manchas del cristal → T_Smudge
function smudgeTex() {
  const rnd = mkRng(31), n = fbm(rnd, 4, 5), c = cv(), x = c.getContext('2d'), im = x.createImageData(N, N);
  for (let i = 0; i < N * N; i++) { const v = Math.max(0, n[i] - 0.45) * 2.2 * 255; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 255; }
  x.putImageData(im, 0, 0);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; return t;
}

// ================= ESTILO CARRERAS =================
const std = (set, o = {}) => new THREE.MeshStandardMaterial({ ...set, side:THREE.DoubleSide, ...o });
const phys = (set, o = {}) => new THREE.MeshPhysicalMaterial({ ...set, side:THREE.DoubleSide, ...o });
const emis = (c, i = 2.5) => new THREE.MeshStandardMaterial({ color:0x000000, emissive:new THREE.Color(c), emissiveIntensity:i, roughness:0.4 });

const STYLES = {
  racing: {
    label:'CARRERAS DE ALTA GAMA · carbono, aluminio y halo',
    make() {
      const carb = carbonSet(20), alu = brushedSet([182, 188, 196], 2, 41), aluD = brushedSet([58, 62, 70], 2, 42), fab = fabricSet([25, 26, 29], 5);
      const carbon = o => phys(carb, { metalness:0.25, clearcoat:1, clearcoatRoughness:0.06, ...o });
      // Nombres de material para Blender entre comentarios
      return {
        nose:carbon({ clearcoat:0.6, envMapIntensity:0.35 }),   // → M_CarbonNose
        noseSide:carbon({ envMapIntensity:0.35 }),              // → M_CarbonNoseSide
        cowlTop:std(fab, { metalness:0 }),                      // → M_Fabric
        cowlLip:std(aluD, { metalness:1 }),                     // → M_AluDark
        dash:carbon(),                                          // → M_Carbon

// ================= GEOMETRÍA =================
// UV por proyección de caja en metros (la escala la pone la repetición de cada textura)
// → En Blender: UV = coordenada en metros según el eje dominante de la normal de cada cara × repetición del material.
function boxUV(g) {
  if (g.index) g = g.toNonIndexed();
  if (!g.attributes.normal) g.computeVertexNormals();
  const p = g.attributes.position, uv = new Float32Array(p.count * 2);
  const a = new V3(), b = new V3(), c = new V3(), e1 = new V3(), e2 = new V3();
  for (let i = 0; i < p.count; i += 3) {
    a.fromBufferAttribute(p, i); b.fromBufferAttribute(p, i + 1); c.fromBufferAttribute(p, i + 2);
    e1.subVectors(b, a); e2.subVectors(c, a); const n = e1.cross(e2);
    const ax = Math.abs(n.x), ay = Math.abs(n.y), az = Math.abs(n.z);
    [a, b, c].forEach((v, j) => {
      let u, w;
      if (ax >= ay && ax >= az) { u = v.z; w = v.y; } else if (ay >= az) { u = v.x; w = v.z; } else { u = v.x; w = v.y; }
      uv[(i + j) * 2] = u; uv[(i + j) * 2 + 1] = w;
    });
  }
  g.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
  return g;
}

function makeBuilder(parent, M, accents) {
  const B = {};
  B.mesh = (g, m, p = parent) => { const o = new THREE.Mesh(boxUV(g), m); p.add(o); return o; };
  // polígono plano en abanico desde el primer punto
  B.poly = (P, m, p = parent) => {
    const pos = []; for (let i = 1; i < P.length - 1; i++) pos.push(...P[0], ...P[i], ...P[i + 1]);
    const g = segGeom(pos); g.computeVertexNormals(); return B.mesh(g, m, p);
  };
  // tira de cuadriláteros entre dos polilíneas
  B.strip = (A, Bb, m, p = parent) => {
    const pos = []; for (let i = 0; i < A.length - 1; i++) pos.push(...A[i], ...Bb[i], ...A[i + 1], ...A[i + 1], ...Bb[i], ...Bb[i + 1]);
    const g = segGeom(pos); g.computeVertexNormals(); return B.mesh(g, m, p);
  };
  // caja redondeada (RoundedBoxGeometry, 2 segmentos de redondeo)
  B.rbox = (w, h, d, m, pos, rot, p = parent, r) => {
    const rr = r ?? Math.min(0.006, Math.min(w, h, d) / 2 - 0.0005);
    const o = B.mesh(new RoundedBoxGeometry(w, h, d, 2, Math.max(0.0005, rr)), m, p);
    o.position.set(...pos); if (rot) o.rotation.set(...rot); return o;
  };
  // viga redondeada entre dos puntos, con la cara mirando hacia el piloto
  B.beam = (p0, p1, w, d, m, toward = [0, 0, 0.3], p = parent, r) => {
    const a = new V3(...p0), b = new V3(...p1), Y = b.clone().sub(a), len = Y.length(); Y.normalize();
    const mid = a.clone().add(b).multiplyScalar(0.5);
    const Z = new V3(...toward).sub(mid).normalize(), X = new V3().crossVectors(Y, Z).normalize(); Z.crossVectors(X, Y).normalize();
    const o = B.mesh(new RoundedBoxGeometry(w, len, d, 2, r ?? Math.min(0.01, Math.min(w, d) / 2 - 0.001)), m, p);
    o.position.copy(mid); o.quaternion.setFromRotationMatrix(new THREE.Matrix4().makeBasis(X, Y, Z));
    return { o, X, Y, Z, a, b, len };
  };
  // tubo por una curva Catmull-Rom (centrípeta, la de three.js por defecto), 10 lados
  B.tube = (pts, r, m, p = parent, seg = 48) => {
    const curve = new THREE.CatmullRomCurve3(pts.map(q => new V3(...q)));
    const o = new THREE.Mesh(new THREE.TubeGeometry(curve, seg, r, 10, false), m); p.add(o); return o;
  };
  B.bolt = (pos, normal, r, p = parent) => {
    const g = new THREE.CylinderGeometry(r, r, r * 0.8, 6); g.translate(0, r * 0.4, 0);
    const o = new THREE.Mesh(g, M.metal); o.position.set(...pos);
    o.quaternion.setFromUnitVectors(new V3(0, 1, 0), new V3(...normal).normalize()); p.add(o); return o;
  };
  // línea de luz (tubo emisivo) → Accent_*
  B.light = (pts, color, r = 0.0022, intensity = 2.5, p = parent) => {
    const m = emis(color, intensity); const o = B.tube(pts, r, m, p, 32); accents.push({ m, base:intensity }); o.userData.noShadow = true; return o;
  };
  // LED (esfera emisiva) → Led_*
  B.led = (pos, color, r = 0.0035, intensity = 3, p = parent) => {
    const m = emis(color, intensity); const o = new THREE.Mesh(new THREE.SphereGeometry(r, 10, 8), m); o.position.set(...pos); p.add(o); accents.push({ m, base:intensity }); o.userData.noShadow = true; return o;
  };
  // rejilla de ventilación con lamas
  B.vent = (pos, w, h, n, m, look = [0, 0, 0.2], p = parent, slat) => {
    const g = new THREE.Group(); g.position.set(...pos); p.add(g); g.lookAt(...look);
    B.rbox(w + 0.016, h + 0.016, 0.012, m, [0, 0, -0.004], null, g, 0.003);
    B.rbox(w, h, 0.008, M.dark, [0, 0, 0.0025], null, g, 0.001);
    for (let i = 0; i < n; i++) B.rbox(w - 0.004, Math.max(0.003, h / n * 0.55), 0.004, slat || m, [0, -h / 2 + (i + 0.5) * h / n, 0.006], [0.6, 0, 0], g, 0.0008);
    return g;
  };
  return B;
}

// ---------- Construcción de la cabina (TODO esto va a Blender) ----------
const matCache = {};
let ck = null, accents = [], styleTick = () => {}, screens = null, mini = null, sceneLights = null;

function buildCockpit(key) {
  const ST = STYLES[key];
  const M = matCache[key] || (matCache[key] = ST.make());
  if (ck) { cockpit.remove(ck); }
  ck = new THREE.Group(); cockpit.add(ck);   // → raíz CockpitVector (origen = ojo del piloto)
  accents = [];
  const B = makeBuilder(ck, M, accents);
  const ticks = [];

  // --- Morro escalonado --- → grupo Nose
  {
    const lv = [[-0.85, 0.80, -0.50], [-1.55, 0.62, -0.60], [-2.25, 0.46, -0.70], [-3.05, 0.28, -0.80]];   // [z, semiancho, y] de cada nivel
    const R = 0.06, STEP = 0.035, SK = 0.16;
    let start = lv[0];
    for (let i = 0; i < lv.length - 1; i++) {
      const [za, ha, ya] = start, [zb, hb, yb] = lv[i + 1], last = i === lv.length - 2;
      const inner = last ? hb : hb + 0.04;
      [-1, 1].forEach(k => {
        B.poly([[k*ha, ya, za], [k*inner, yb, zb], [0, yb + R, zb], [0, ya + R, za]], M.nose);
        B.poly([[k*ha, ya, za], [k*inner, yb, zb], [k*inner, yb - SK, zb], [k*ha, ya - SK, za]], M.noseSide);
        if (!last) B.poly([[k*inner, yb, zb], [k*hb, yb - STEP, zb - 0.02], [0, yb - STEP + R, zb - 0.02], [0, yb + R, zb]], M.dark);
      });
      if (!last) start = [zb - 0.02, hb, yb - STEP];
    }
    const [zt, ht, yt] = lv[lv.length - 1];
    B.poly([[-ht, yt, zt], [0, yt + R, zt], [ht, yt, zt], [ht + 0.04, yt - 0.07, zt - 0.06], [-ht - 0.04, yt - 0.07, zt - 0.06]], M.noseSide);
    // franja roja central pintada sobre el carbono
    [-1, 1].forEach(k => {
      let s0 = lv[0];
      for (let i = 0; i < lv.length - 1; i++) {
        const [za, ha, ya] = s0, [zb, hb0, yb] = lv[i + 1], last = i === lv.length - 2, hb = last ? hb0 : hb0 + 0.04;
        const off = 0.0025, wa = 0.07 - i * 0.012, wb = 0.07 - (i + 1) * 0.012;
        B.poly([[0, ya + R + off, za], [k*wa, ya + R - R * wa / ha + off, za], [k*wb, yb + R - R * wb / hb + off, zb], [0, yb + R + off, zb]], M.paint);
        s0 = [zb - 0.02, hb0, yb - 0.035];
      }
    });
    B.led([-ht + 0.05, yt + 0.02, zt - 0.01], ST.accent, 0.007, 4);   // → Led_Nose_L
    B.led([ht - 0.05, yt + 0.02, zt - 0.01], ST.accent, 0.007, 4);    // → Led_Nose_R
  }

  // --- Salpicadero: visera y frontal --- → grupo Dash
  const NU = 40, us = [...Array(NU + 1)].map((_, i) => -1 + 2 * i / NU);
  const sF = u => { const a = Math.max(0, (Math.abs(u) - 0.35) / 0.65); return a * a; };
  const F  = us.map(u => [0.90 * u, -0.300 + 0.19 * sF(u), -0.80 + 0.32 * sF(u)]);
  const Lp = F.map(p => [p[0] * 0.97, p[1] + 0.035, p[2] + 0.15]);
  const L2 = Lp.map(p => [p[0], p[1] - 0.03, p[2] + 0.004]);
  const Bt = L2.map(p => [p[0] * 0.97, -0.72, p[2] + 0.13]);
  B.strip(F, Lp, M.cowlTop);
  B.strip(Lp, L2, M.cowlLip);
  B.strip(L2, Bt, M.dash);
  B.tube(Lp.map(p => [p[0], p[1] - 0.004, p[2] + 0.002]), 0.008, M.cowlLip, ck, 80);   // canto redondeado
  B.tube(F.map(p => [p[0], p[1] - 0.003, p[2]]), 0.006, M.cowlTop, ck, 80);
  B.light(L2.map(p => [p[0] * 0.995, p[1] - 0.012, p[2] + 0.008]).slice(4, -4), ST.accent, 0.0016, 2.2);   // → Accent_Visor

  // --- Pantallas MFD --- → grupos Screen_L_Housing / Screen_R_Housing y planos Screen_L / Screen_R
  function makePanel(parent, pos, orient, W, H, D, cw, ch, extras = true) {
    const g = new THREE.Group(); g.position.set(...pos); parent.add(g);
    if (orient.look) g.lookAt(...orient.look); else g.rotation.set(...orient.rot);
    const T = ST.housingT;
    B.rbox(W + 2*T, T, D, M.housing, [0,  H/2 + T/2, -D/2], null, g);
    B.rbox(W + 2*T, T, D, M.housing, [0, -H/2 - T/2, -D/2], null, g);
    B.rbox(T, H, D, M.housing, [-W/2 - T/2, 0, -D/2], null, g);
    B.rbox(T, H, D, M.housing, [ W/2 + T/2, 0, -D/2], null, g);
    B.rbox(W + 2*T, H + 2*T, 0.01, M.dark, [0, 0, -D - 0.005], null, g, 0.002);
    // sombra interior del techo de la pantalla (negro al 70 %, sin sombras) → Screen_*_Shade
    const wall = new THREE.Mesh(new THREE.PlaneGeometry(W, D), new THREE.MeshBasicMaterial({ color:0x000000, transparent:true, opacity:0.7, side:THREE.DoubleSide }));
    wall.rotation.x = Math.PI / 2; wall.position.set(0, H/2 - 0.001, -D/2); wall.userData.noShadow = true; g.add(wall);
    // bisel/placa de montaje
    if (extras) {
      const bw = W + 2*T + 0.03;
      B.rbox(bw, 0.03, 0.012, M.bezel, [0, -H/2 - T - 0.012, -0.004], null, g, 0.004);
      B.light([[-W/2 - T, -H/2 - T - 0.003, 0.001], [W/2 + T, -H/2 - T - 0.003, 0.001]], ST.accent, 0.0012, 2, g);
    }   // → Accent_Screen_L / Accent_Screen_R
    // superficie de la pantalla: 640×200 px de HUD, brillo ×1.35, sin luz ni sombras → Screen_L / Screen_R (UV 0-1 completo)
    const cvs = document.createElement('canvas'); cvs.width = cw; cvs.height = ch;
    const tex = new THREE.CanvasTexture(cvs); tex.colorSpace = THREE.SRGBColorSpace; tex.anisotropy = 8;
    const sm = new THREE.MeshBasicMaterial({ map:tex }); sm.color.setScalar(1.35);
    const scr = new THREE.Mesh(new THREE.PlaneGeometry(W, H), sm); scr.position.z = -D + 0.004; scr.userData.noShadow = true; g.add(scr);
    // luz de la pantalla (va en Godot, no en Blender)
    const light = new THREE.PointLight(ST.screenLight, 0, 0.9, 1.6); light.position.set(0, 0, 0.06); g.add(light);
    return { cv:cvs, ctx:cvs.getContext('2d'), tex, light };
  }
  const makeScreen = k => makePanel(ck, [0.41 * k, -0.285, -0.528], { look:[0, 0.02, 0.12] }, 0.27, 0.085, 0.045, 640, 200);
  screens = { L:makeScreen(-1), R:makeScreen(1) };
  // --- Radar y minimapa: colocación 1, pantallas pequeñas entre las dos grandes ---
  const lay1 = S.layout === 1, sideR = S.swap ? 1 : -1;
  if (lay1) {
    mini = {
      radar:makePanel(ck, [0.205 * sideR, -0.265, -0.545], { look:[0, 0.02, 0.12] }, 0.09, 0.09, 0.035, 256, 256),
      map:  makePanel(ck, [-0.205 * sideR, -0.265, -0.545], { look:[0, 0.02, 0.12] }, 0.09, 0.09, 0.035, 256, 256),
    };
  }

  // --- Consola central --- → grupo Console
  {
    const cg = new THREE.Group(); cg.position.set(0, -0.345, -0.565); cg.rotation.x = 0.45; ck.add(cg);
    // en la colocación 1 la consola se estrecha (0,32 → 0,26 m) para dejar sitio a las pantallas pequeñas
    B.rbox(lay1 ? 0.26 : 0.32, 0.075, 0.13, M.console, [0, 0, 0], null, cg, 0.008);
    if (!lay1) {
      // colocación 2: radar y minimapa en la cara de arriba de la consola, en lugar de los mandos
      mini = {
        radar:makePanel(cg, [0.075 * sideR, 0.0495, -0.02], { rot:[-Math.PI / 2, 0, 0] }, 0.1, 0.1, 0.012, 256, 256, false),
        map:  makePanel(cg, [-0.075 * sideR, 0.0495, -0.02], { rot:[-Math.PI / 2, 0, 0] }, 0.1, 0.1, 0.012, 256, 256, false),
      };
    }
    // mandos rotativos y botones
    if (lay1) [-0.09, 0, 0.09].forEach((x, i) => {
      const kn = new THREE.Mesh(new THREE.CylinderGeometry(0.014, 0.016, 0.016, 24), i === 1 ? M.paint : M.metal); kn.position.set(x, 0.046, -0.01); cg.add(kn);
      B.rbox(0.003, 0.002, 0.012, M.dark, [x, 0.0545, -0.016], null, cg, 0.0005);
    });
    if (lay1) [-0.105, -0.035, 0.035, 0.105].forEach(x => { const b = new THREE.Mesh(new THREE.CylinderGeometry(0.007, 0.007, 0.006, 16), M.dark); b.position.set(x, 0.041, 0.035); cg.add(b); B.led([x, 0.045, 0.035], 0xFF8A00, 0.0025, 1.4, cg); });   // → Led_Console_0..3 (de izquierda a derecha)
  }

  // --- Marco del cristal --- → grupo Frame
  const topY = 0.395, topZ = -0.56;
  B.beam([-1.3, topY, topZ], [1.3, topY, topZ], 0.065, 0.095, M.topBar, [0, -0.3, 0.3]);
  // luces de cambio (shift lights) sobre la visera → carcasas ShiftLight_Base_00..14 y LEDs ShiftLight_00..14 (de izquierda a derecha)
  const sl = [];
  for (let i = 0; i < 15; i++) {
    const x = -0.098 + i * 0.014;
    B.rbox(0.011, 0.008, 0.01, M.dark, [x, -0.258, -0.66], null, ck, 0.0015);
    const m = emis(i < 5 ? 0x3DFF8A : (i < 10 ? 0xFF2D2D : 0x3D7BFF), 0);
    const o = new THREE.Mesh(new THREE.SphereGeometry(0.0035, 10, 8), m); o.position.set(x, -0.2535, -0.655); o.userData.noShadow = true; ck.add(o); sl.push(m);
  }
  // lógica de las shift lights (va al código del juego)
  ticks.push(() => {
    const n = Math.round(15 * Math.max(0, Math.min(1, (S.speed - 0.55 * TOP) / (0.45 * TOP))));
    const flash = (S.speed > TOP + 1 || S.boost) && Math.floor(S.t * 10) % 2 === 0;
    sl.forEach((m, i) => { m.emissiveIntensity = (S.speed > TOP + 1 || S.boost) ? (flash ? 4 : 0) : (i < n ? 3.5 : 0); if (S.speed > TOP + 1 || S.boost) m.emissive.setHex(0x3D7BFF); else m.emissive.setHex(i < 5 ? 0x3DFF8A : (i < 10 ? 0xFF2D2D : 0x3D7BFF)); });
  });
  // halo: barra central y travesaño inferior → Halo
  B.beam([0, topY - 0.02, topZ + 0.02], [0, -0.27, -0.74], 0.03, 0.04, M.pillar, [0, 0, 0.3]);
  B.beam([-0.06, -0.275, -0.74], [0.06, -0.275, -0.74], 0.03, 0.03, M.pillar, [0, 0.3, 0.3]);
  // techo
  const roof = B.poly([[-1.3, 0.43, -0.60], [1.3, 0.43, -0.60], [1.3, 0.47, 0.6], [-1.3, 0.47, 0.6]], M.roof); roof.userData.noShadow = true;

    B.rbox(0.10, 0.032, 0.075, M.strip, [k*0.45, -0.283, -0.76], [0, -k*0.5, 0]);
    // tira exterior entre cristal frontal y lateral
    B.beam([k*0.66, 0.40, -0.45], [k*0.84, -0.15, -0.52], 0.09, 0.045, M.strip, [0, 0, 0.2]);

    B.beam([k*0.80, 0.43, -0.48], [k*0.90, 0.43, 0.7], 0.07, 0.06, M.strip, [0, 0, 0.1]);
    B.beam([k*0.88, 0.42, 0.55], [k*0.96, -0.15, 0.65], 0.12, 0.05, M.strip, [0, 0, 0]);
    // brazola y pared lateral
    B.beam([k*0.84, -0.15, -0.50], [k*0.88, -0.14, 0.8], 0.11, 0.05, M.sill, [0, 1, 0.2]);
    B.poly([[k*0.79, -0.17, -0.45], [k*0.83, -0.17, 0.8], [k*0.72, -0.9, 0.8], [k*0.70, -0.9, -0.45]], M.wall);
    B.vent([k*0.752, -0.30, -0.12], 0.12, 0.07, 6, M.strip, [0, -0.3, -0.12], ck, M.strip);
    // salidas de aire en el frontal
    B.vent([k*0.70, -0.30, -0.52], 0.09, 0.05, 5, M.console, [0, 0.05, 0.1], ck, M.console);
    // tirador de anclaje en aluminio
    B.tube([[k*0.82, -0.12, -0.2], [k*0.80, -0.08, -0.12], [k*0.80, -0.08, 0.02], [k*0.82, -0.12, 0.1]], 0.007, M.metal);
  });
  // cristal: manchas (suma de color, opacidad 0,012, sin escribir profundidad) → Glass_Smudge
  {
    const smudge = matCache.smudge || (matCache.smudge = smudgeTex());
    smudge.repeat.set(2.2, 2.2);
    const sm = new THREE.MeshBasicMaterial({ map:smudge, transparent:true, opacity:0.012, blending:THREE.AdditiveBlending, depthWrite:false, side:THREE.DoubleSide, toneMapped:false });
    const quad = [[-0.47, 0.36, -0.566], [0.47, 0.36, -0.566], [0.42, -0.27, -0.795], [-0.42, -0.27, -0.795]];

  const L = ST.lights;

  const amb = new THREE.AmbientLight(L.amb[0], L.amb[1]);
  const key2 = new THREE.DirectionalLight(L.key[0], L.key[1]);
  key2.position.set(0.7, 2.2, -1.6); key2.target.position.set(0, -0.3, -0.4);
  key2.castShadow = true; key2.shadow.mapSize.set(2048, 2048);

let last = performance.now();

function update(dt) {

  const accel = S.auto || keys['w'] || keys['arrowup'];
  const brake = keys['s'] || keys['arrowdown'] || hold.brake;
  const topEff = TOP * (1 - 0.03 * S.dmg);
  if (S.boost) { S.boostT -= dt; if (S.boostT <= 0) { S.boost = false; S.cooldown = true; S.cdT = 4; } }
  else if (S.cooldown) { S.cdT -= dt; if (S.cdT <= 0) S.cooldown = false; }

  S.x = Math.max(-HALF + 1.6, Math.min(HALF - 1.6, S.x + S.steer * 12 * (0.25 + 0.75 * f) * dt));
  S.dist += S.speed / 3.6 * dt;

    if (r.far) r.off += r.dv * dt;
    const ds = r.far ? r.off : r.base + r.A * Math.sin(r.w * S.t + r.ph);
    let lat = r.la[0] * Math.sin(r.la[1] * S.t + r.la[2]);

    lat = Math.max(-HALF + 1.6, Math.min(HALF - 1.6, lat));

  const glow = 0.35 + 0.35 * f;
  screens.L.light.intensity = screens.R.light.intensity = glow * 0.3;
  mini.radar.light.intensity = mini.map.light.intensity = glow * 0.2;
  boostLight.intensity = S.boostTint * 3.2; boostLight2.intensity = S.boostTint * 2.0; dmgLight.intensity = dmgTint * 3.0;
  tintEl.style.background =
    `radial-gradient(ellipse 75% 75% at 50% 55%, rgba(255,157,50,0) 55%, rgba(255,157,50,${(0.35 * S.boostTint * 0.5).toFixed(3)}) 100%),` +
    `radial-gradient(ellipse 75% 75% at 50% 55%, rgba(255,77,94,0) 50%, rgba(255,77,94,${(0.4 * dmgTint * 0.5).toFixed(3)}) 100%)`;

  // parpadeo de luces de la cabina con daño (Accent_* y Led_*)
  accents.forEach(e => e.m.emissiveIntensity = e.base);
  if (S.dmg >= 1) {
    S.flickT -= dt;
    if (S.flickT <= 0) { S.flickOn = 0.12; S.flickT = (0.35 + Math.random() * 0.8) / S.dmg; S.flickSet = accents.filter(() => Math.random() < [0, 0.15, 0.3, 0.5][S.dmg]); }
    if (S.flickOn > 0) { S.flickOn -= dt; S.flickSet.forEach(e => e.m.emissiveIntensity = e.base * 0.2); }
  }
  styleTick(st);
  drawLeft(st); drawRight(st); drawRadarScreen(st); drawMapScreen(st);
  timeEl.textContent = fmt(S.race % 80);
}
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  update(dt);
  composer.render();
  requestAnimationFrame(frame);
}
function resize() {
  const st = document.getElementById('stage');
  const W = st.clientWidth, H = st.clientHeight;
  let w = W, h = W * 9 / 16; if (h > H) { h = H; w = H * 16 / 9; }
  view.style.width = w + 'px'; view.style.height = h + 'px';
  view.style.setProperty('--u', (h / 720) + 'px');
  renderer.setSize(w, h, false);
  composer.setPixelRatio(DPR); composer.setSize(w, h);
}
addEventListener('resize', resize); resize();
(document.fonts ? document.fonts.ready : Promise.resolve()).then(() => {
  buildCockpit(S.style);
  document.getElementById('loading').style.display = 'none';
  toast(STYLES[S.style].label);
  requestAnimationFrame(t => { last = t; frame(t); });
});
</script>
</body>
</html>
