<script type="module">
// =====================================================================================
// VECTORY — Prototipo de cabina 3D de BLADE · estilo MILITAR (burbuja + morro largo)
// Mismos ejes que Godot y que el prototipo de Vector: X derecha, Y arriba, el piloto mira a −Z.
// Origen de la cabina = ojo del piloto. Ojo a 0,90 m sobre la pista (Vector 1,45 × 0,62). FOV vertical 70°.
// Los comentarios "→ Nombre" dicen cómo se llama cada pieza en Blender.
// Disposiciones del cuadro de mando: 1 COMBATE · 2 RELOJES · 3 TÁCTICO (guardadas) y 4 DEFINITIVA (táctico + cristal HUD).
// Va a Blender: buildCockpit() y las texturas. Va al juego: el dibujo de las pantallas y las luces.
// No va a ningún sitio: el mundo, las naves simuladas, la conducción, los botones y la mirada con ratón.

  main:'#A8FF8A',   // fósforo verde
  dim:'#3F7F34',
  label:'#86A07E',
  over:'#FFB020',   // ámbar: por encima de la punta o con boost

  rival:'#FFB020',  // rivales en ámbar

  bar:'#1A2618', bg:'#020502', orbOff:'#22301F',

const LIGHT = { boost:'#FFA040', dmg:'#FF4D3A', caution:'#FFB020', warning:'#FF2A1E', accent:'#7CFF5A', nav_l:'#FF2A1E', nav_r:'#3DFF6A', sensor:'#7CFF5A' };

const view = document.getElementById('view');

const camera = new THREE.PerspectiveCamera(70, 16 / 9, 0.02, 3000);

// =====================================================================================
// Texturas (generadas, deterministas: mismas semillas → misma imagen)
// =====================================================================================
function mkRng(seed) { let s = (seed >>> 0) || 1; return () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s >>>= 0; s ^= s << 5; s >>>= 0; return s / 4294967296; }; }

}

  for (let o = 0; o < oct; o++) { const n = valueNoise(N, Math.max(1, cell / (1 << o)), rng); for (let i = 0; i < out.length; i++) out[i] += n[i] * amp; sum += amp; amp *= 0.5; }

function canvasTex(N, fill, srgb) {

// col: Float32 RGB 0..255 (N*N*3) · rough: 0..1 · height: 0..1 · strength: fuerza del relieve
function fromArrays(N, col, rough, height, strength) {

    for (let y = 0; y < N; y++) for (let x = 0; x < N; x++) {

// Pintura militar gris verdoso mate con desconchones (semilla 61)
function paintSet(seed, base) {
  const r = mkRng(seed), m = fbm(TN, 128, 4, r), ch = fbm(TN, 24, 3, r), fine = valueNoise(TN, 2, r);

    const chip = ch[i] > 0.76 ? Math.min(1, (ch[i] - 0.76) * 12) : 0, k = 0.90 + 0.18 * m[i] + 0.04 * fine[i];

// Pintura rugosa negra de paneles (crinkle) (semilla 62)
function crinkleSet(seed) {
  const r = mkRng(seed), a = valueNoise(TN, 2, r), b = valueNoise(TN, 5, r), m = fbm(TN, 96, 3, r);
  const col = new Float32Array(TN * TN * 3), ro = new Float32Array(TN * TN), he = new Float32Array(TN * TN);
  for (let i = 0; i < TN * TN; i++) { const n = a[i] * 0.6 + b[i] * 0.4, k = 0.88 + 0.22 * n + 0.08 * m[i]; col[i * 3] = 22 * k; col[i * 3 + 1] = 25 * k; col[i * 3 + 2] = 23 * k; ro[i] = 0.80 + 0.12 * n; he[i] = n; }

}
// Antideslizante del cubre-instrumentos y del panel anti-reflejos del morro (semilla 63)
function antiSlipSet(seed) {
  const r = mkRng(seed), g = valueNoise(TN, 1, r), m = fbm(TN, 64, 3, r);
  const col = new Float32Array(TN * TN * 3), ro = new Float32Array(TN * TN), he = new Float32Array(TN * TN);
  for (let i = 0; i < TN * TN; i++) { const k = 0.82 + 0.30 * g[i] + 0.12 * m[i]; col[i * 3] = 36 * k; col[i * 3 + 1] = 39 * k; col[i * 3 + 2] = 38 * k; ro[i] = 0.93 + 0.05 * g[i]; he[i] = g[i] * 0.7 + m[i] * 0.3; }
  return fromArrays(TN, col, ro, he, 3);
}
// Pavonado / metal de cañón cepillado (semilla 64)
function gunmetalSet(seed) {
  const r = mkRng(seed), row = new Float32Array(TN); for (let y = 0; y < TN; y++) row[y] = r();
  const m = fbm(TN, 128, 3, r), col = new Float32Array(TN * TN * 3), ro = new Float32Array(TN * TN), he = new Float32Array(TN * TN);
  for (let y = 0; y < TN; y++) for (let x = 0; x < TN; x++) { const i = y * TN + x, n = row[y] * 0.5 + m[i] * 0.5, k = 0.86 + 0.24 * n; col[i * 3] = 88 * k; col[i * 3 + 1] = 93 * k; col[i * 3 + 2] = 99 * k; ro[i] = 0.34 + 0.16 * n; he[i] = row[y] * 0.3; }
  return fromArrays(TN, col, ro, he, 1.5);
}
// Franjas amarillas y negras con desgaste (tirador del cristal) (semilla 65)
function hazardSet(seed) {
  const r = mkRng(seed), w = fbm(TN, 32, 3, r), col = new Float32Array(TN * TN * 3), ro = new Float32Array(TN * TN), he = new Float32Array(TN * TN);
  for (let y = 0; y < TN; y++) for (let x = 0; x < TN; x++) {
    const i = y * TN + x, yel = ((x + y) % 128) < 64, worn = w[i] > 0.72 ? 1 : 0;
    const c = worn ? [70, 72, 70] : (yel ? [214, 168, 26] : [18, 18, 16]); const k = 0.9 + 0.15 * w[i];
    col[i * 3] = c[0] * k; col[i * 3 + 1] = c[1] * k; col[i * 3 + 2] = c[2] * k; ro[i] = worn ? 0.45 : 0.6; he[i] = worn ? 0 : 0.2;

}
// Manchas del cristal (semilla 66)
function smudgeTex(seed) {
  const r = mkRng(seed), n = fbm(TN, 96, 5, r);
  return canvasTex(TN, d => { for (let i = 0; i < TN * TN; i++) { const v = Math.max(0, (n[i] - 0.45) * 2.4); const c = Math.min(255, v * v * 255); d[i * 4] = d[i * 4 + 1] = d[i * 4 + 2] = c; d[i * 4 + 3] = 255; } }, true);
}
const SETS = {
  paint: paintSet(61, [72, 80, 72]),      // gris verdoso del interior
  paintNose: paintSet(67, [92, 100, 94]), // gris claro del morro (exterior)
  crinkle: crinkleSet(62),
  antiSlip: antiSlipSet(63),
  gunmetal: gunmetalSet(64),
  hazard: hazardSet(65),

const SMUDGE = smudgeTex(66);
function rep(set, k) { const o = {}; for (const key of ['map', 'rough', 'normal']) { const t = set[key].clone(); t.repeat.set(k, k); t.needsUpdate = true; o[key] = t; } return o; }

// =====================================================================================
// Entorno para reflejos: noche, ciudad naranja en el horizonte y luces azules arriba
// =====================================================================================
function buildEnv() {
  const s = new THREE.Scene(), g = new THREE.SphereGeometry(50, 64, 32), cols = [], p = g.attributes.position;
  const lerp = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t), ss = (a, b, x) => { const t = Math.min(1, Math.max(0, (x - a) / (b - a))); return t * t * (3 - 2 * t); };
  for (let i = 0; i < p.count; i++) {
    const h = p.getY(i) / 50;
    const c = h >= 0 ? lerp([0.34, 0.13, 0.04], [0.01, 0.014, 0.04], ss(0, 0.45, h)) : lerp([0.22, 0.09, 0.03], [0.008, 0.009, 0.01], ss(0, -0.3, h));
    cols.push(...c);
  }
  g.setAttribute('color', new THREE.Float32BufferAttribute(cols, 3));
  s.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({ vertexColors: true, side: THREE.BackSide })));
  const r = mkRng(77);
  for (let i = 0; i < 40; i++) { const a = r() * Math.PI * 2, w = 1 + r() * 4, m = new THREE.Mesh(new THREE.PlaneGeometry(w, 0.3 + r() * 1.2), new THREE.MeshBasicMaterial({ color: new THREE.Color(1.6, 0.7, 0.2), side: THREE.DoubleSide })); m.position.set(Math.cos(a) * 40, 0.5 + r() * 2, Math.sin(a) * 40); m.lookAt(0, m.position.y, 0); s.add(m); }

// =====================================================================================
// Materiales
// =====================================================================================
const DS = THREE.DoubleSide;

function texMat(set, k, extra) { const t = rep(set, k); return std(Object.assign({ map: t.map, roughnessMap: t.rough, normalMap: t.normal, roughness: 1 }, extra)); }
const MAT = {
  Paint: texMat(SETS.paint, 3, { metalness: 0.15, name: 'M_Paint' }),                  // interior gris verdoso
  PaintDark: texMat(SETS.paint, 3, { metalness: 0.15, color: new THREE.Color(0.55, 0.58, 0.56), name: 'M_PaintDark' }), // arco y marcos
  PaintNose: texMat(SETS.paintNose, 1.5, { metalness: 0.12, envMapIntensity: 0.5, name: 'M_PaintNose' }), // morro (exterior)
  Crinkle: texMat(SETS.crinkle, 8, { metalness: 0.1, name: 'M_Crinkle' }),              // frontal y carcasas
  AntiSlip: texMat(SETS.antiSlip, 10, { metalness: 0, name: 'M_AntiSlip' }),            // cubre-instrumentos
  Gunmetal: texMat(SETS.gunmetal, 2, { metalness: 1, name: 'M_Gunmetal' }),             // carriles, tornillos, postes
  Hazard: texMat(SETS.hazard, 12, { metalness: 0.1, name: 'M_Hazard' }),                // tirador del cristal
  Rubber: std({ color: '#0B0C0B', roughness: 0.95, metalness: 0, name: 'M_Rubber' }),   // juntas y botones
  Dark: std({ color: '#050605', roughness: 0.9, metalness: 0, name: 'M_Dark' }),
  Mirror: std({ color: '#AAB0B0', roughness: 0.04, metalness: 1, name: 'M_Mirror' }),
  Shade: new THREE.MeshBasicMaterial({ color: '#000', transparent: true, opacity: 0.7, side: DS, name: 'M_ScreenShade' }),

function emissive(col, name) { return std({ color: '#000', emissive: new THREE.Color(col), emissiveIntensity: 0, roughness: 0.4, name: name }); }

// =====================================================================================
// Piezas de construcción (mismas que van a art/blender/lib/)
// =====================================================================================
function boxUV(geo) {

function makeMFD(parent, name, pos, look, w, h, cw, ch, draw, opt = {}) {

    B.mesh(B.rbox(bw, bh, 0.006, 0.0015), MAT.Dark, g, name + '_Bezel').position.set(x, y, 0.005);
  });

    const nH = Math.max(3, Math.round(w / 0.026)), nV = Math.max(3, Math.round(h / 0.026));
    for (let i = 0; i < nH; i++) { const x = -w / 2 + w * (i + 0.5) / nH; [h / 2 + bz * 0.55, -h / 2 - bz * 0.55].forEach(y => { B.mesh(B.rbox(0.011, 0.007, 0.007, 0.002), MAT.Rubber, g, 'OSB').position.set(x, y, 0.006); }); }
    for (let i = 0; i < nV; i++) { const y = -h / 2 + h * (i + 0.5) / nV; [-w / 2 - bz * 0.55, w / 2 + bz * 0.55].forEach(x => { B.mesh(B.rbox(0.007, 0.011, 0.007, 0.002), MAT.Rubber, g, 'OSB').position.set(x, y, 0.006); }); }
    // balancines de brillo y contraste en las esquinas
    [[-1, 1], [1, 1], [-1, -1], [1, -1]].forEach(([sx, sy]) => { B.mesh(B.rbox(0.009, 0.009, 0.006, 0.002), MAT.Gunmetal, g, 'Rocker').position.set(sx * (w / 2 + bz * 0.6), sy * (h / 2 + bz * 0.6), 0.006); });
  }
  if (opt.pod) { // caja que sobresale del frontal: pestaña de anclaje atornillada al fondo y nervios laterales → <name>_Flange
    const fz = -dep + 0.010;
    B.mesh(B.rbox(hw + 0.026, hh + 0.022, 0.008, 0.003), MAT.Paint, g, name + '_Flange').position.z = fz;
    [[-1, 1], [1, 1], [-1, -1], [1, -1]].forEach(([sx, sy]) => screw(g, sx * (hw / 2 + 0.008), sy * (hh / 2 + 0.006), fz + 0.0045, 0.003));
    [-1, 1].forEach(sx => { [0.3, -0.3].forEach(k => {
      B.mesh(B.rbox(0.004, 0.010, dep - 0.02, 0.0015), MAT.Crinkle, g, name + '_Rib').position.set(sx * (hw / 2 + 0.002), k * hh, -dep / 2 - 0.004); }); });
    B.mesh(B.rbox(hw - 0.02, 0.003, dep - 0.03, 0.001), MAT.Dark, g, name + '_Seam').position.set(0, -hh / 2 - 0.0005, -dep / 2 - 0.002);
  }
  screw(g, -hw / 2 + 0.006, hh / 2 - 0.006, 0.003); screw(g, hw / 2 - 0.006, hh / 2 - 0.006, 0.003); screw(g, -hw / 2 + 0.006, -hh / 2 + 0.006, 0.003); screw(g, hw / 2 - 0.006, -hh / 2 + 0.006, 0.003);
  if (opt.visor) { // visera: chapa inclinada sobre la pantalla, laterales que la cierran y luz tenue por debajo → <name>_Visor
    const vd = opt.visor, vt = hh / 2 + 0.004, a = 0.32, fy = vt - vd * Math.sin(a), fz = vd * Math.cos(a);
    const vg = B.group(g, name + '_Visor');

    top.position.set(0, (vt + fy) / 2 + 0.003, fz / 2 - 0.004); top.rotation.x = a;
    B.mesh(B.rbox(hw + 0.018, 0.009, 0.010, 0.003), MAT.Rubber, vg, name + '_VisorLip').position.set(0, fy + 0.002, fz - 0.004);
    [-1, 1].forEach(sx => { const x = sx * (hw / 2 + 0.007);
      B.mesh(B.poly([[x, vt + 0.006, -0.006], [x, fy + 0.006, fz], [x, fy - 0.014, fz - 0.006], [x, vt - 0.045, -0.002]]), MAT.Crinkle, vg, name + '_VisorSide'); });
    const lm = emissive(LIGHT.accent, 'M_Emissive_Accent'); const lt = B.mesh(B.rbox(hw * 0.7, 0.002, 0.002, 0.0008), lm, vg, 'Led_Visor_' + name.replace('Screen_', ''), { noShadow: true });
    lt.position.set(0, fy - 0.004, fz - 0.010); LIVE.leds.push({ mat: lm, base: 0.35, flick: 1 });
    screw(vg, -hw / 2 + 0.004, fy + 0.0, fz - 0.012, 0.0028); screw(vg, hw / 2 - 0.004, fy + 0.0, fz - 0.012, 0.0028);

  screenPlane(g, name, w, h, cw, ch, draw);
  const sh = B.mesh(new THREE.PlaneGeometry(w, 0.012), MAT.Shade, g, name + '_Shade', { noShadow: true }); sh.position.set(0, h / 2 - 0.004, 0.006); sh.rotation.x = 0.9;

// ---------------- Añadido sobre el diseño original (spec 3.4): vida en el frontal → Switch_Panel_L / Switch_Panel_R ----------------
// Coordenadas del frontal (Dash_Face): X derecha, Y hacia arriba por la cara, Z hacia el piloto; cara delantera en z = 0,025.
// Las piezas pequeñas llevan caja de 1 segmento y esferas bajas: son menudas y así cuestan pocos triángulos.
const FACE_FRONT = 0.025;
const smallBox = (w, h, d, r) => boxUV(new RoundedBoxGeometry(w, h, d, 1, Math.min(r, w / 2.01, h / 2.01, d / 2.01)));
function smallRivet(parent, pos) { const r = B.mesh(boxUV(new THREE.SphereGeometry(0.0035, 6, 4)), MAT.Gunmetal, parent, 'Rivet', { noShadow: true }); r.position.set(...pos); r.scale.z = 0.4; return r; }
function toggleSwitch(p, x, y, z, up) { // palanca: up = 1 arriba, −1 abajo
  const nut = B.cyl(0.0055, 0.0055, 0.004, 12, MAT.Gunmetal, p, 'Toggle_Nut'); nut.rotation.x = Math.PI / 2; nut.position.set(x, y, z + 0.002);
  const tilt = Math.PI / 2 - 0.4 * up, ay = Math.cos(tilt), az = Math.sin(tilt), len = 0.02;
  const lv = B.cyl(0.0018, 0.0026, len, 10, MAT.Gunmetal, p, 'Toggle_Lever'); lv.rotation.x = tilt; lv.position.set(x, y + ay * (0.004 + len / 2), z + az * (0.004 + len / 2));
  B.mesh(boxUV(new THREE.SphereGeometry(0.0032, 8, 6)), MAT.Gunmetal, p, 'Toggle_Tip').position.set(x, y + ay * (0.004 + len), z + az * (0.004 + len));
}
function rotarySelector(p, x, y, z, r, ang) { // aro oscuro con marcas, mando de goma y aguja
  const ring = B.cyl(r * 1.45, r * 1.45, 0.003, 32, MAT.Dark, p, 'Selector_Ring'); ring.rotation.x = Math.PI / 2; ring.position.set(x, y, z + 0.0015);
  for (let i = 0; i < 5; i++) { const a = (-60 + 30 * i) * Math.PI / 180, rr = r * 1.25;
    const t = B.mesh(B.poly([[-0.00075, -0.00225, 0], [0.00075, -0.00225, 0], [0.00075, 0.00225, 0], [-0.00075, 0.00225, 0]]), MAT.Paint, p, 'Selector_Tick', { noShadow: true });
    t.position.set(x + Math.sin(a) * rr, y + Math.cos(a) * rr, z + 0.0031); t.rotation.z = -a; }
  const knob = B.cyl(r, r * 1.08, 0.012, 24, MAT.Rubber, p, 'Selector_Knob'); knob.rotation.x = Math.PI / 2; knob.position.set(x, y, z + 0.009);
  const ptr = B.mesh(smallBox(0.003, r * 1.6, 0.003, 0.001), MAT.Gunmetal, p, 'Selector_Pointer'); ptr.position.set(x, y, z + 0.0155); ptr.rotation.z = -ang;
}
function guardedSwitch(p, x, y, z) { // interruptor con tapa de seguridad a franjas, cerrada (tipo MASTER ARM)
  B.mesh(B.rbox(0.036, 0.046, 0.004, 0.0015), MAT.Dark, p, 'Arm_Base').position.set(x, y, z + 0.002);
  B.mesh(B.rbox(0.030, 0.038, 0.011, 0.003), MAT.Hazard, p, 'Arm_Cover').position.set(x, y - 0.002, z + 0.0095);
  const h = B.cyl(0.003, 0.003, 0.032, 10, MAT.Gunmetal, p, 'Arm_Hinge'); h.rotation.z = Math.PI / 2; h.position.set(x, y + 0.019, z + 0.007);
}
function switchPanel(face, sx) { // placa atornillada: 2 × 3 palancas con guardas, selector y tapa (izquierda) o segundo selector (derecha)
  const p = B.group(face, sx < 0 ? 'Switch_Panel_L' : 'Switch_Panel_R', [sx * 0.47, -0.005, FACE_FRONT]);
  const w = 0.24, h = 0.17, t = 0.006;
  B.mesh(B.rbox(w, h, t, 0.003), MAT.Paint, p, 'Switch_Plate').position.z = t / 2;
  [[-1, 1], [1, 1], [-1, -1], [1, -1]].forEach(([cx, cy]) => screw(p, cx * (w / 2 - 0.009), cy * (h / 2 - 0.009), t + 0.0015));
  const pattern = [[1, 1, -1], [1, -1, 1]], cols = [-0.085, -0.050, -0.015];
  [0.035, -0.035].forEach((y, row) => {
    cols.forEach((x, col) => toggleSwitch(p, sx * x, y, t, pattern[row][col]));
    [cols[0] - 0.0175, cols[0] + 0.0175, cols[1] + 0.0175, cols[2] + 0.0175].forEach(x => B.mesh(smallBox(0.0025, 0.028, 0.013, 0.001), MAT.PaintDark, p, 'Toggle_Guard').position.set(sx * x, y, t + 0.0065));
  });
  rotarySelector(p, sx * 0.062, 0.038, t, 0.011, sx * 0.5);
  if (sx < 0) guardedSwitch(p, sx * 0.062, -0.040, t); else rotarySelector(p, sx * 0.062, -0.040, t, 0.008, -0.5);
}
function faceSeams(face) { // juntas que dividen el frontal en paneles, con remaches

    [0.132, 0.335, 0.628].forEach(x => seam([[sx * x - 0.002, y0, z], [sx * x + 0.002, y0, z], [sx * x + 0.002, y1, z], [sx * x - 0.002, y1, z]]));
    seam([[sx * 0.335, 0.098, z], [sx * 0.628, 0.098, z], [sx * 0.628, 0.102, z], [sx * 0.335, 0.102, z]]);
    [0.335 - 0.008, 0.628 - 0.008].forEach(x => { for (let y = -0.14; y < 0.11; y += 0.035) smallRivet(face, [sx * x, y, FACE_FRONT]); });

function buildCockpit(variant) {

  // juntas transversales y longitudinales
  [-1.6, -2.4, -3.2, -4.0].forEach((z, i) => {
    const j = st.findIndex(s => s[0] < z), a = st[j - 1], b = st[j], t = (z - a[0]) / (b[0] - a[0]), w = a[1] + (b[1] - a[1]) * t, y = a[2] + (b[2] - a[2]) * t;
    B.mesh(B.poly([[-w * 0.55, y + 0.0015, z - 0.004], [w * 0.55, y + 0.0015, z - 0.004], [w * 0.55, y + 0.0015, z + 0.004], [-w * 0.55, y + 0.0015, z + 0.004]]), MAT.Dark, nose, 'Nose_Seam_' + i, { noShadow: true });
  });

    [-1, 1].forEach(sx => { const r = B.sphere(0.0045, MAT.Gunmetal, nose, 'Rivet', { noShadow: true }); r.scale.y = 0.4; r.position.set(sx * w * 0.70, y - 0.004, z); });
